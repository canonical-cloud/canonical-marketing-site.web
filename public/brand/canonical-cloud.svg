<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="246 249 750 750" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Canonical Cloud layered C</title>
  <desc id="description">A letter C of three concentric rings, green above and cyan below, mirrored across a central gap, with the inner rings ending in horizontal bars.</desc>

  <defs>
    <!-- Outer and middle rings end in a horizontal cut level with the bar gap. -->
    <clipPath id="ring-cut" clipPathUnits="userSpaceOnUse">
      <path d="M0 0H1254V452H641V617H0Z"/>
    </clipPath>
    <!-- Upper half; the lower half is the same shape mirrored across y = 624. -->
    <g id="half" stroke-width="50">
      <g clip-path="url(#ring-cut)">
        <path d="M291.07 617A350 350 0 0 1 969.9 504.3"/>
        <path d="M357.09 617A284 284 0 0 1 907.9 526.9"/>
      </g>
      <path d="M423.11 617A218 218 0 0 1 814.4 492"/>
      <path d="M814.4 492H950" stroke-linecap="round"/>
    </g>
  </defs>

  <use href="#half" xlink:href="#half" stroke="#5ade90"/>
  <use href="#half" xlink:href="#half" stroke="#10b1c8" transform="matrix(1 0 0 -1 0 1248)"/>
</svg>
