name: scoped canonical.plus security headers

# Manual only. The environment MUST have required reviewers before allowing
# apply. This workflow deliberately does not run on pull_request or push.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only inspect, or apply with explicit confirmation'
        type: choice
        required: true
        default: inspect
        options: [inspect, apply]
      approved_sha:
        description: 'Exact reviewed main Git commit SHA (40 lowercase hex)'
        required: true
        type: string
      confirmation:
        description: 'For apply only: enter APPLY_CANONICAL_PLUS_HEADERS'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-canonical-plus-headers
  cancel-in-progress: false

jobs:
  cloudflare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: cloudflare-production
    steps:
      - name: Check out reviewed default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Require exact approved main commit before zone access
        shell: bash
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Expected exact reviewed commit SHA"; exit 1;
          }
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA" || {
            echo "::error::Current main is not the approved revision"; exit 1;
          }
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
      - name: Validate proposed Cloudflare rule offline
        run: node --test tests/cloudflare-header-rule.test.mjs
      - name: Inspect or apply approved zone-scoped rule
        env:
          CANONICAL_CF_ZONE_ID: ${{ secrets.CANONICAL_CF_ZONE_ID }}
          CANONICAL_CF_API_TOKEN: ${{ secrets.CANONICAL_CF_API_TOKEN }}
          CANONICAL_CF_CONFIRM: ${{ inputs.confirmation }}
        run: node scripts/cloudflare-header-rule.mjs "${{ inputs.mode }}"
      - name: Audit live response headers after approved apply
        if: ${{ inputs.mode == 'apply' }}
        run: node scripts/audit-live-response-headers.mjs
