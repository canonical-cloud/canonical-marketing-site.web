name: live marketing smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "41 9 * * *"

permissions:
  contents: read

concurrency:
  group: live-people-profile
  cancel-in-progress: true

jobs:
  public-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed Utkarsh profile and actual photo
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const url = 'https://canonical.plus/people/';
          const response = await fetch(url, {
            headers: { 'Cache-Control': 'no-cache' },
            redirect: 'follow',
            signal: AbortSignal.timeout(20000),
          });
          console.log('People page status:', response.status, 'URL:', response.url);
          assert.equal(response.status, 200, 'public People page must be available');

          const html = await response.text();
          assert.match(html, /Utkarsh Shukla/, 'deployed People page must include Utkarsh');
          assert.match(html, /Infosec Expert/, 'deployed People page must include the correct role');
          assert.match(html, /data-person-id="utkarsh-shukla"/, 'profile must render as a card');
          const portraitPath = '/team/utkarsh-shukla.webp';
          assert.ok(html.includes(portraitPath), 'profile must point to the supplied local portrait');

          const portraitUrl = new URL(portraitPath, response.url);
          const photoResponse = await fetch(portraitUrl, {
            headers: { 'Cache-Control': 'no-cache' },
            signal: AbortSignal.timeout(20000),
          });
          console.log('Portrait response:', photoResponse.status, portraitUrl.href);
          assert.equal(photoResponse.status, 200, 'profile photo must load');
          const bytes = Buffer.from(await photoResponse.arrayBuffer());
          assert.ok(bytes.length > 1000, 'photo must not be an empty placeholder');
          assert.equal(bytes.toString('ascii', 0, 4), 'RIFF');
          assert.equal(bytes.toString('ascii', 8, 12), 'WEBP');
          console.log('PASS: live profile, role, and supplied WebP portrait are published.');
          const fetchPage = async (url) => {
            const result = await fetch(url, {
              headers: { 'Cache-Control': 'no-cache' },
              redirect: 'follow',
              signal: AbortSignal.timeout(20000),
            });
            console.log('Public page:', result.url, 'status:', result.status);
            assert.equal(result.status, 200, `public page must respond: ${url}`);
            return result.text();
          };

          const homepage = await fetchPage('https://canonical.plus/');
          const quotePage = await fetchPage('https://canonical.plus/quote/');
          const bookingUrl = 'https://calendly.com/hello-canonical/30min';
          for (const [pageName, page] of [['homepage', homepage], ['quote', quotePage]]) {
            assert.ok(page.includes('Book an intro'), `${pageName}: Book an intro is visible`);
            assert.ok(page.includes(bookingUrl), `${pageName}: the direct Calendly link is present`);
          }
          assert.equal(quotePage.includes('Sign in for account quote'), false, 'quote page has no sign-in button');
          console.log('PASS: public home and quote have direct Calendly links with no quote sign-in CTA.');

          // Verify deployed readiness content, not just merged source or home HTML.
          const readinessPage = await fetchPage('https://canonical.plus/readiness/');
          const frameworksPage = await fetchPage('https://canonical.plus/frameworks/');
          const comparePage = await fetchPage('https://canonical.plus/compare/');

          for (const marker of [
            'id="readiness-preview"',
            'Find the gaps before your independent reviewer does',
            'Evidence-readiness index',
            'id="preview-sample-link"',
          ]) assert.ok(homepage.includes(marker), `homepage missing: ${marker}`);

          for (const marker of [
            'id="sample-finding"',
            'What an actionable readiness finding looks like',
            'Privileged access review evidence is incomplete',
            'This fictional IAM example',
            'id="evidence-readiness"',
            'Out of scope (documented)',
          ]) assert.ok(readinessPage.includes(marker), `readiness page missing: ${marker}`);

          for (const marker of [
            'id="starter-checklists"',
            'Pre-audit readiness starter checklists',
            'id="soc2"', 'id="iso27001"', 'id="hipaa"', 'id="pci-dss"', 'id="nist-csf"',
          ]) assert.ok(frameworksPage.includes(marker), `frameworks page missing: ${marker}`);

          for (const marker of [
            'id="existing-platforms"',
            'Already using Vanta, Drata, or Secureframe?',
            'no claim of partnership, endorsement, API integration',
          ]) assert.ok(comparePage.includes(marker), `comparison page missing: ${marker}`);

          for (const marker of [
            'id="quote-scope-summary"',
            'Not included by default:',
            'id="quote-estimate-book-intro"',
          ]) assert.ok(quotePage.includes(marker), `quote page missing: ${marker}`);

          console.log('PASS: all five live marketing pages expose scoped, illustrative pre-audit content and quote handoff.');


          const cloudHome = await fetchPage('https://canonical-cloud.github.io/');
          const header = cloudHome.match(/<header\b[\s\S]*?<\/header>/)?.[0];
          assert.ok(header, 'Canonical Cloud public header must render');
          assert.doesNotMatch(header, />\s*Product\s*</i, 'public header has no Product label');
          assert.doesNotMatch(header, /Log in|Sign up|Sign in|Create an account/i, 'public header has no auth CTAs');
          console.log('PASS: Canonical Cloud header has no Product or login/signup actions.');

          // Check served JS and CSS, not only server HTML: CSS ::before introduced
          // the original visible Product badge that previous HTML checks missed.
          assert.ok(homepage.includes('site.js?v=20261010-clean-logo'), 'live HTML must load revised header JS');
          const liveBrandCss = await fetchPage('https://canonical.plus/brand-overrides.css?v=20261010-clean-logo');
          const liveBrandJs = await fetchPage('https://canonical.plus/site.js?v=20261010-clean-logo');
          assert.ok(liveBrandCss.includes('.nav__plus-brand-name'), 'served CSS must style the new header classes');
          assert.ok(liveBrandJs.includes('nav__plus-brand-name'), 'served JS must create the new header classes');
          assert.equal(liveBrandCss.includes("content: 'product'"), false, 'served CSS must not inject Product');
          assert.equal(liveBrandCss.includes('nav__product-brand'), false, 'served CSS has no old Product selectors');
          assert.equal(liveBrandJs.includes('canonical.plus product'), false, 'served JS has no Product aria label');
          assert.equal(liveBrandJs.includes('nav__product-brand'), false, 'served JS has no old Product class');
          console.log('PASS: live header assets contain no CSS Product badge, ARIA label, or legacy class.');

          NODE
