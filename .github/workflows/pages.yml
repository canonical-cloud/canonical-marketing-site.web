name: pages

on:
  # Once the protected Edge release is verified, this manual path republishes
  # the SAME reviewed main commit without a dummy push or CI bypass.
  workflow_dispatch:
    inputs:
      approved_sha:
        description: 'Exact reviewed main Git commit (40 lowercase hex)'
        required: true
        type: string
      ci_run_id:
        description: 'Successful push-triggered main CI run ID for approved_sha'
        required: true
        type: string
      confirmation:
        description: 'Type PUBLISH_CANONICAL_SITE to authorize the Pages cutover'
        required: true
        type: string
  # Production Pages deploys only the exact main-branch commit that completed
  # the blocking CI workflow (including Playwright + Puppeteer). A parallel
  # push-triggered workflow could otherwise publish while browser CI is red.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages-build:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.confirmation == 'PUBLISH_CANONICAL_SITE')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify manual publication matches main and executed successful CI
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CANONICAL_APPROVED_SHA: ${{ inputs.approved_sha }}
          CANONICAL_CI_RUN_ID: ${{ inputs.ci_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANONICAL_APPROVED_SHA" || {
            echo "::error::Main branch advanced since the approved release"; exit 1;
          }
          node scripts/verify-pages-ci.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - run: npm ci
      - run: npm test
      - name: Validate production public-intake configuration
        shell: bash
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
        run: |
          set -euo pipefail
          case "$PUBLIC_SUPABASE_URL" in
            "") echo "::warning::PUBLIC_SUPABASE_URL is not configured: publish public pages with quote/contact delivery disabled and an email fallback" ;;
            https://*.supabase.co) ;;
            *)
              echo "::error::PUBLIC_SUPABASE_URL must be configured as an https://*.supabase.co origin when set"
              exit 1
              ;;
          esac
      # An enabled email form must never be published against the old or
      # unverified public-intake contract. The exact reviewed main SHA is
      # stamped by the manual Edge deploy; if it is stale, Pages fails closed
      # and the previous live site remains until the Edge release is verified.
      - name: Verify live Edge contract before enabling public quote email
        shell: bash
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          CANONICAL_EXPECTED_RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_sha || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "$PUBLIC_SUPABASE_URL" ]]; then
            echo "::notice::Public intake not configured: quote/contact email disabled in published pages"
          else
            export SUPABASE_PROJECT_REF
            SUPABASE_PROJECT_REF="$(node --input-type=module -e 'import { projectRefFromPublicUrl } from "./scripts/verify-intake-release.mjs"; process.stdout.write(projectRefFromPublicUrl(process.env.PUBLIC_SUPABASE_URL));')"
            node scripts/verify-intake-release.mjs
          fi
      - name: Build the canonical.plus site
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
        run: >-
          npm run build --
          --site https://canonical.plus
          --base /
      - name: Verify root-domain URLs
        shell: bash
        run: |
          grep -q 'href="/"' dist/index.html
          grep -q 'href="/favicon.svg"' dist/index.html
          grep -Eq 'href="/_astro/[^" ]+\.css"' dist/index.html
          ! grep -q '/canonical-marketing-site.web/' dist/index.html
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
