name: application-route-authority

on:
  pull_request:
    paths:
      - 'README.md'
      - 'src/pages/index.astro'
      - 'public/site.js'
      - 'contracts/application-route-sources.json'
      - 'scripts/check-application-route-authority.mjs'
      - '.github/workflows/application-route-authority.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'src/pages/index.astro'
      - 'public/site.js'
      - 'contracts/application-route-sources.json'
      - 'scripts/check-application-route-authority.mjs'
      - '.github/workflows/application-route-authority.yml'

permissions:
  contents: read

jobs:
  route-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out marketing exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: marketing
      - name: Read exact authority revisions
        id: authority
        working-directory: marketing
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const lock = require('./contracts/application-route-sources.json');
          console.log(`docs_rev=${lock.sources.productInformationArchitecture.revision}`);
          console.log(`web_rev=${lock.sources.customerWebRoute.revision}`);
          NODE
      - name: Check out product information architecture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: canonical-cloud/canonical-docs
          ref: ${{ steps.authority.outputs.docs_rev }}
          persist-credentials: false
          path: canonical-docs
      - name: Check out customer web route implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: canonical-cloud/canonical-web-server.rs
          ref: ${{ steps.authority.outputs.web_rev }}
          persist-credentials: false
          path: canonical-web-server.rs
      - name: Compare CTA against both authorities
        working-directory: marketing
        run: node scripts/check-application-route-authority.mjs ../canonical-docs ../canonical-web-server.rs
      - name: Keep checkout immutable
        working-directory: marketing
        run: git diff --exit-code
